<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicons для всех платформ (с фолбэками) -->
    <!-- Основной SVG favicon (современные браузеры) -->
    <link rel="icon" type="image/svg+xml" href="/assets/diary-beast-black.svg" />
    <!-- Фолбэки для старых браузеров -->
    <link rel="icon" type="image/x-icon" href="/assets/diary-beast-black.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/diary-beast-black.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/diary-beast-black.svg" />
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/diary-beast-logo-colored.svg" />

    <!-- Primary Meta Tags -->
    <title>DiaryBeast - Write Daily. Grow Your Beast. Own Your Mind.</title>
    <meta name="title" content="DiaryBeast - Write Daily. Grow Your Beast. Own Your Mind." />
    <meta name="description" content="Most diary apps bore you or feel invasive. DiaryBeast is the middle ground. Your Beast evolves through life paths—financial, creative, wellness, learning. AI insights, artist collabs, gamification that means something." />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.diarybeast.xyz/" />
    <meta property="og:title" content="DiaryBeast - Write Daily. Grow Your Beast. Own Your Mind." />
    <meta property="og:description" content="Most diary apps bore you or feel invasive. DiaryBeast is the middle ground. Your Beast evolves through life paths. AI insights, artist collabs, gamification that means something." />
    <meta property="og:image" content="https://www.diarybeast.xyz/assets/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:site_name" content="DiaryBeast" />

    <!-- X (Twitter) Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@_DiaryBeast" />
    <meta name="twitter:creator" content="@0x10Shabsh" />
    <meta name="twitter:title" content="DiaryBeast - Write Daily. Grow Your Beast. Own Your Mind." />
    <meta name="twitter:description" content="Most diary apps bore you or feel invasive. DiaryBeast is the middle ground. Your Beast evolves through life paths. Gamification that means something." />
    <meta name="twitter:image" content="https://www.diarybeast.xyz/assets/og-image.png" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#0A0E1A" />
    <meta name="color-scheme" content="dark" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

</html>
